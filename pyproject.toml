[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stochpy"
version = "0.1.0"
description = "Python library for composing deterministic and stochastic LLM-powered functions"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "litellm>=1.0",
    "jinja2>=3.0",
    "pyyaml>=6.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
